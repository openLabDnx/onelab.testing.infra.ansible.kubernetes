---
- name: Show Cloudflare Tunnel status
  hosts: "{{ groups['rke2_servers'][0] }}"
  become: yes
  gather_facts: no
  tasks:
    - name: Load pinned tunnel token
      ansible.builtin.include_role:
        name: cloudflare_tunnel
        tasks_from: tunnel_token.yaml

    - name: Resolve Cloudflare zone, account and tunnel
      ansible.builtin.include_role:
        name: cloudflare_tunnel
        tasks_from: lookup.yaml

    - name: Fail when the tunnel does not exist
      ansible.builtin.fail:
        msg: "Tunnel {{ cloudflare_tunnel_name }} does not exist yet. Run `make cloudflare`."
      when: cloudflare_tunnel_id | length == 0

    - name: Verify tunnel end to end
      ansible.builtin.include_role:
        name: cloudflare_tunnel
        tasks_from: verify.yaml
