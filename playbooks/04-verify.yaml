---
- name: Verify RKE2 Kubernetes Cluster Health
  hosts: "{{ groups['rke2_servers'][0] }}"
  become: yes
  gather_facts: no
  tasks:
    - name: Wait for all nodes in inventory to register with cluster
      ansible.builtin.shell: |
        /var/lib/rancher/rke2/bin/kubectl --kubeconfig /etc/rancher/rke2/rke2.yaml get nodes --no-headers | wc -l
      register: node_count
      until: node_count.stdout | int >= groups['rke2_cluster'] | length
      retries: 30
      delay: 10
      changed_when: false

    - name: Get Kubernetes Cluster Nodes
      ansible.builtin.command: /var/lib/rancher/rke2/bin/kubectl --kubeconfig /etc/rancher/rke2/rke2.yaml get nodes -o wide
      register: kubectl_nodes
      changed_when: false

    - name: Get Cluster System Pods
      ansible.builtin.command: /var/lib/rancher/rke2/bin/kubectl --kubeconfig /etc/rancher/rke2/rke2.yaml get pods -A -o wide
      register: kubectl_pods
      changed_when: false

    - name: Display Cluster Nodes
      ansible.builtin.debug:
        msg: "{{ kubectl_nodes.stdout_lines }}"

    - name: Display System Pods
      ansible.builtin.debug:
        msg: "{{ kubectl_pods.stdout_lines }}"
