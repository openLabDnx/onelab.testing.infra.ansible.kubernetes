---
- name: Destroy HashiCorp Vault and ALL of its data
  hosts: "{{ groups['rke2_servers'][0] }}"
  become: yes
  gather_facts: no
  vars_prompt:
    - name: vault_reset_confirm
      prompt: "This permanently deletes Vault and every secret stored in it. Type 'destroy-vault' to continue"
      private: no
  tasks:
    - name: Abort unless confirmed
      ansible.builtin.fail:
        msg: "Confirmation not given, nothing was changed."
      when: vault_reset_confirm != 'destroy-vault'

    - name: Tear down Vault
      ansible.builtin.include_role:
        name: vault
        tasks_from: reset.yaml
