---
- name: Check installed Helm version
  ansible.builtin.command: "{{ helm_binary_path }} version --short"
  register: helm_installed
  changed_when: false
  failed_when: false

- name: Install Helm {{ helm_version }}
  when: helm_installed.rc != 0 or helm_installed.stdout.split('+')[0] != helm_version
  vars:
    helm_arch: "{{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }}"
    helm_archive_url: "https://get.helm.sh/helm-{{ helm_version }}-linux-{{ helm_arch }}.tar.gz"
  block:
    - name: Gather CPU architecture
      ansible.builtin.setup:
        gather_subset: [min]
      when: ansible_architecture is not defined

    - name: Download Helm archive
      ansible.builtin.get_url:
        url: "{{ helm_archive_url }}"
        dest: "/tmp/helm-{{ helm_version }}.tar.gz"
        checksum: "sha256:{{ helm_archive_url }}.sha256sum"
        mode: "0644"

    - name: Extract Helm binary
      ansible.builtin.unarchive:
        src: "/tmp/helm-{{ helm_version }}.tar.gz"
        dest: "/tmp"
        remote_src: yes

    - name: Install Helm binary
      ansible.builtin.copy:
        src: "/tmp/linux-{{ helm_arch }}/helm"
        dest: "{{ helm_binary_path }}"
        mode: "0755"
        remote_src: yes
