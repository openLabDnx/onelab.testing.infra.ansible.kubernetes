---
- name: Ensure manifest directory exists
  ansible.builtin.file:
    path: "{{ local_path_provisioner_manifest_dir }}"
    state: directory
    mode: "0755"

- name: Download local-path-provisioner manifest
  ansible.builtin.get_url:
    url: "{{ local_path_provisioner_manifest_url }}"
    dest: "{{ local_path_provisioner_manifest_dir }}/local-path-storage-{{ local_path_provisioner_version }}.yaml"
    mode: "0644"

- name: Apply local-path-provisioner manifest
  ansible.builtin.command: >
    {{ cluster_kubectl }} apply
    -f {{ local_path_provisioner_manifest_dir }}/local-path-storage-{{ local_path_provisioner_version }}.yaml
  register: local_path_apply
  changed_when: local_path_apply.stdout is search('(created|configured)')

- name: Create '{{ local_path_retain_class_name }}' StorageClass (reclaimPolicy Retain)
  ansible.builtin.command:
    cmd: "{{ cluster_kubectl }} apply -f -"
    stdin: |
      apiVersion: storage.k8s.io/v1
      kind: StorageClass
      metadata:
        name: {{ local_path_retain_class_name }}
      provisioner: rancher.io/local-path
      volumeBindingMode: WaitForFirstConsumer
      reclaimPolicy: Retain
  register: local_path_retain_apply
  changed_when: local_path_retain_apply.stdout is search('(created|configured)')

- name: Wait for local-path-provisioner to be rolled out
  ansible.builtin.command: >
    {{ cluster_kubectl }} -n local-path-storage
    rollout status deployment/local-path-provisioner --timeout=180s
  changed_when: false

- name: List StorageClasses
  ansible.builtin.command: "{{ cluster_kubectl }} get storageclass"
  register: storage_classes
  changed_when: false

- name: Display StorageClasses
  ansible.builtin.debug:
    msg: "{{ storage_classes.stdout_lines }}"
