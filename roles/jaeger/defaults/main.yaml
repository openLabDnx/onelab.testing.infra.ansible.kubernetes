---
# Defaults for jaeger role
# Jaeger v2 (built on the OpenTelemetry Collector) as one pod: receives OTLP
# from Alloy, stores spans in Badger on a Longhorn volume, serves the UI and
# the API (Grafana datasource), and turns spans into request/error/latency
# metrics (span metrics) for the UI's Monitor tab and Grafana.
# 2.21+ removed the v1 HTTP API (/api/services, /api/traces) that Grafana's
# Jaeger datasource (Grafana 13.2) still calls: stay on 2.20 until Grafana
# speaks the v3 API.
jaeger_image: "docker.io/jaegertracing/jaeger:2.20.0"

# Badger is an embedded database: one writer, so exactly one replica.
jaeger_span_ttl: "168h"                  # 7 days
jaeger_storage_class: "longhorn-retain"  # two copies, one per primary-site node (roles/longhorn)
jaeger_storage_size: "20Gi"
jaeger_resources:
  requests: { cpu: 100m, memory: 256Mi }
  limits: { memory: 1Gi }

# Span metrics are read back from Prometheus for the Monitor tab
jaeger_prometheus_url: "http://kube-prometheus-stack-prometheus.{{ observability_namespace }}.svc:9090"

jaeger_kubectl: "{{ cluster_kubectl }} -n {{ observability_namespace }}"
