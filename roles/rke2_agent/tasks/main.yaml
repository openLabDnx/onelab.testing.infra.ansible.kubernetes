---
- name: Ensure RKE2 configuration directory exists
  ansible.builtin.file:
    path: "{{ rke2_config_dir }}"
    state: directory
    mode: "0755"

- name: Render RKE2 agent config.yaml
  ansible.builtin.template:
    src: config.yaml.j2
    dest: "{{ rke2_config_dir }}/config.yaml"
    mode: "0600"
    owner: root
    group: root
  notify: Restart rke2-agent

- name: Check if RKE2 binary is already installed
  ansible.builtin.stat:
    path: /usr/local/bin/rke2
  register: rke2_binary

- name: Download and install RKE2 agent
  ansible.builtin.shell: |
    curl -sfL https://get.rke2.io | \
    INSTALL_RKE2_TYPE="agent" \
    INSTALL_RKE2_CHANNEL="{{ rke2_channel }}" \
    {% if rke2_version | length > 0 %}INSTALL_RKE2_VERSION="{{ rke2_version }}"{% endif %} \
    sh -
  args:
    creates: /usr/local/bin/rke2
  when: not rke2_binary.stat.exists

- name: Enable and start rke2-agent systemd service
  ansible.builtin.systemd:
    name: "{{ rke2_service_name }}"
    state: started
    enabled: yes
    daemon_reload: yes

- name: Create symlinks for crictl and ctr
  ansible.builtin.file:
    src: "/var/lib/rancher/rke2/bin/{{ item }}"
    dest: "/usr/local/bin/{{ item }}"
    state: link
    force: yes
  loop:
    - crictl
    - ctr
  ignore_errors: true
