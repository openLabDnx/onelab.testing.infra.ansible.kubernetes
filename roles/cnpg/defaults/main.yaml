---
# Defaults for cnpg role
# CloudNativePG operator: runs the PostgreSQL clusters (authentik) and does the
# automatic failover, so it runs with two replicas (leader election).
cnpg_namespace: "cnpg-system"
cnpg_chart_repo_url: "https://cloudnative-pg.github.io/charts"
cnpg_chart_version: "0.29.1"          # operator 1.30.1
cnpg_replicas: 2
