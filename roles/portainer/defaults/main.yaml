---
# Defaults for portainer role
portainer_chart_repo_url: "https://portainer.github.io/k8s/"
portainer_chart_version: "245.1.0"
portainer_image_tag: "2.45.1"
portainer_storage_class: "longhorn-retain"     # two copies, one per primary-site node (roles/longhorn)
portainer_storage_size: "10Gi"
# Users created by SSO login land in this team. It gets no environment access
# by default: an admin grants namespaces/environments (production.md SEC-05).
portainer_sso_team: "sso-users"
portainer_kubectl: "{{ cluster_kubectl }} -n {{ portainer_namespace }}"

# Portainer CE has no group -> role mapping for OAuth logins. These SSO usernames
# are made Portainer administrators once they exist (after their first SSO login);
# add your own authentik username here and re-run `make portainer`.
portainer_admin_users:
  - akadmin
