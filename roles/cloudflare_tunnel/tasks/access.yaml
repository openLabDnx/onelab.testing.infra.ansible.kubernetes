---
- name: Build Access policy include rules
  ansible.builtin.set_fact:
    cloudflare_access_include: >-
      {{ (cloudflare_access_allowed_email_domains
          | map('community.general.dict_kv', 'domain') | map('community.general.dict_kv', 'email_domain') | list)
         + (cloudflare_access_allowed_emails
          | map('community.general.dict_kv', 'email') | map('community.general.dict_kv', 'email') | list) }}

- name: Ensure the Access policy allows someone
  ansible.builtin.assert:
    that: cloudflare_access_include | length > 0
    fail_msg: "Set cloudflare_access_allowed_email_domains or cloudflare_access_allowed_emails."
    quiet: true

# --- reusable policy --------------------------------------------------------
- name: List Access policies
  ansible.builtin.include_tasks: api.yaml
  vars:
    cf_path: "/accounts/{{ cloudflare_account_id }}/access/policies?per_page=100"

- name: Find Access policy {{ cloudflare_access_policy_name }}
  ansible.builtin.set_fact:
    access_policy: "{{ cf_response.result | selectattr('name', 'equalto', cloudflare_access_policy_name) | first | default({}) }}"
    access_policy_body:
      name: "{{ cloudflare_access_policy_name }}"
      decision: allow
      include: "{{ cloudflare_access_include }}"
      session_duration: "{{ cloudflare_access_session_duration }}"

- name: Create Access policy
  ansible.builtin.include_tasks: api.yaml
  vars:
    cf_method: POST
    cf_path: "/accounts/{{ cloudflare_account_id }}/access/policies"
    cf_body: "{{ access_policy_body }}"
  when: access_policy | length == 0

- name: Update Access policy when its rules changed
  ansible.builtin.include_tasks: api.yaml
  vars:
    cf_method: PUT
    cf_path: "/accounts/{{ cloudflare_account_id }}/access/policies/{{ access_policy.id }}"
    cf_body: "{{ access_policy_body }}"
  when:
    - access_policy | length > 0
    - access_policy.include != cloudflare_access_include or access_policy.decision != 'allow'
      or access_policy.session_duration | default('') != cloudflare_access_session_duration

- name: Record Access policy id
  ansible.builtin.set_fact:
    access_policy_id: "{{ access_policy.id if access_policy | length > 0 else cf_response.result.id }}"

# --- applications (one per protected hostname, all sharing the policy) ---
- name: Ensure Access application per protected hostname
  ansible.builtin.include_tasks: access_app.yaml
  loop: "{{ cloudflare_access_protected }}"
  loop_control:
    loop_var: access_target
    label: "{{ access_target.hostname }}"

- name: Display Access protection
  ansible.builtin.debug:
    msg: >-
      Behind Cloudflare Access: {{ cloudflare_access_protected | map(attribute='hostname') | join(', ') }};
      allowed: {{ (cloudflare_access_allowed_email_domains | map('regex_replace', '^', '@') | list) + cloudflare_access_allowed_emails }}
