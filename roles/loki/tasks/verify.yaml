---
- name: Find the Grafana API
  ansible.builtin.include_role:
    name: platform_vars
    tasks_from: grafana_api.yaml

# Grafana's health check runs a Loki query through the datasource, i.e. through
# the NetworkPolicy, exactly like a user in Explore.
- name: Grafana reaches Loki
  ansible.builtin.uri:
    url: "{{ grafana_api }}/datasources/uid/loki/health"
    url_username: "{{ grafana_admin_user }}"
    url_password: "{{ grafana_admin_password }}"
    force_basic_auth: true
    return_content: true
  register: loki_health
  until: loki_health.status == 200 and loki_health.json.status == 'OK'
  retries: 18
  delay: 10
  no_log: true

- name: Show Loki placement
  ansible.builtin.command: >
    {{ loki_kubectl }} get pod loki-0
    -o custom-columns=POD:.metadata.name,READY:.status.containerStatuses[0].ready,NODE:.spec.nodeName --no-headers
  register: loki_pod
  changed_when: false

- name: Display Loki summary
  ansible.builtin.debug:
    msg:
      - "Loki {{ loki_chart_version }} (chart): {{ loki_pod.stdout }}; Grafana datasource: {{ loki_health.json.message }}"
      - "Retention {{ loki_retention_period }}, {{ loki_storage_size }} volume on {{ loki_storage_class }}"
      - "Push (Alloy only): http://loki.{{ observability_namespace }}.svc.cluster.local:3100 - see the logs in Grafana > Explore / Drilldown > Logs"
