---
# Defaults for loki role
# Grafana Loki stores the cluster's logs: pod logs, node journals, Kubernetes
# events and OTLP logs, all shipped by roles/alloy. One process ("Monolithic")
# with its chunks and index on a Longhorn volume, because there is no object
# storage here; that also means one replica (see README: Observability).
loki_chart_repo_url: "https://grafana-community.github.io/helm-charts"   # moved from grafana/helm-charts
loki_chart_version: "18.13.7"            # Loki 3.7.8

# Logs older than this are deleted by the compactor. ~0.5 GB/day of raw logs
# today, stored compressed: 30 days take a few GB.
loki_retention_period: "720h"            # 30 days
loki_storage_class: "longhorn-retain"    # two copies, one per primary-site node (roles/longhorn)
loki_storage_size: "50Gi"
loki_resources:
  requests: { cpu: 250m, memory: 1Gi }
  limits: { memory: 2Gi }

# Ingestion limits (single tenant). They absorb catch-up bursts, e.g. Alloy on
# worker1 resending after the 160 ms link was down; Loki answers 429 above them
# and Alloy retries.
loki_ingestion_rate_mb: 8
loki_ingestion_burst_size_mb: 16
loki_per_stream_rate_limit: "5MB"
loki_per_stream_rate_limit_burst: "20MB"

# job label of Loki's own metrics (the chart's ServiceMonitor: <namespace>/<service>)
loki_metrics_job: "{{ observability_namespace }}/loki"

loki_kubectl: "{{ cluster_kubectl }} -n {{ observability_namespace }}"
