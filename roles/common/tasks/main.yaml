---
- name: Check operating system compatibility
  ansible.builtin.assert:
    that:
      - ansible_os_family == "Debian"
    fail_msg: "This role is currently configured for Ubuntu/Debian Linux distributions."

- name: Set hostname to match inventory name
  ansible.builtin.hostname:
    name: "{{ inventory_hostname }}"
  when: ansible_hostname != inventory_hostname

- name: Update /etc/hosts with all cluster nodes
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: ".*\\s+{{ item }}$"
    line: "{{ hostvars[item]['ansible_host'] }} {{ item }}"
    state: present
  loop: "{{ groups['rke2_cluster'] }}"

- name: Disable swap immediately
  ansible.builtin.command: swapoff -a
  changed_when: false

- name: Remove swap entry from /etc/fstab
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^([^#].*?\sswap\s+sw\s+.*)$'
    replace: '# \1'

- name: Configure kernel modules for RKE2 / Kubernetes
  ansible.builtin.copy:
    dest: /etc/modules-load.d/rke2.conf
    content: |
      overlay
      br_netfilter
    mode: "0644"

- name: Load kernel modules
  ansible.builtin.command: "modprobe {{ item }}"
  loop: "{{ required_kernel_modules }}"
  register: modprobe_res
  changed_when: false
  failed_when: false

- name: Apply sysctl configuration for Kubernetes
  ansible.builtin.copy:
    dest: /etc/sysctl.d/90-rke2.conf
    content: |
      net.bridge.bridge-nf-call-iptables = 1
      net.bridge.bridge-nf-call-ip6tables = 1
      net.ipv4.ip_forward = 1
      vm.max_map_count = 262144
      fs.inotify.max_user_instances = 8192
      fs.inotify.max_user_watches = 524288
    mode: "0644"
  notify: Reload sysctl

- name: Ensure sysctl is reloaded immediately
  ansible.builtin.command: sysctl --system
  changed_when: false

- name: Update apt cache and install prerequisite packages
  ansible.builtin.apt:
    name: "{{ common_packages }}"
    state: present
    update_cache: yes
    cache_valid_time: 3600

- name: Ensure systemd-timesyncd is enabled and running
  ansible.builtin.systemd:
    name: systemd-timesyncd
    state: started
    enabled: yes
  ignore_errors: true

- name: Create RKE2 configuration directory
  ansible.builtin.file:
    path: "{{ rke2_config_dir }}"
    state: directory
    mode: "0755"
    owner: root
    group: root

- name: Longhorn node prerequisites
  ansible.builtin.import_tasks: longhorn.yaml
