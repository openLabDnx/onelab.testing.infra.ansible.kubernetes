---
# Defaults for common role
rke2_config_dir: "/etc/rancher/rke2"

common_packages:
  - curl
  - wget
  - tar
  - socat
  - conntrack
  - ipset
  - iptables
  - jq
  - net-tools
  - ca-certificates
  - software-properties-common
  - systemd-timesyncd

required_kernel_modules:
  - overlay
  - br_netfilter

required_sysctl_params:
  net.bridge.bridge-nf-call-iptables: 1
  net.bridge.bridge-nf-call-ip6tables: 1
  net.ipv4.ip_forward: 1
  vm.max_map_count: 262144
  fs.inotify.max_user_instances: 8192
  fs.inotify.max_user_watches: 524288

# Longhorn node prerequisites (tasks/longhorn.yaml)
longhorn_node_packages:
  - open-iscsi        # volumes are attached to the node over iSCSI
  - nfs-common        # NFSv4 client: RWX volumes, NFS backup targets
  - cryptsetup        # encrypted volumes
  - dmsetup
longhorn_kernel_modules:
  - iscsi_tcp
  - dm_crypt
