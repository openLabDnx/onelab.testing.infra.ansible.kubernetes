---
- name: Argo CD advertises authentik SSO
  ansible.builtin.uri:
    url: "https://{{ argocd_host }}/api/v1/settings"
    return_content: true
  register: argocd_settings
  until: argocd_settings.status == 200 and (argocd_settings.json.oidcConfig.name | default('')) == 'authentik'
  retries: 12
  delay: 10
  delegate_to: localhost
  become: false

- name: SSO login redirects to authentik
  ansible.builtin.uri:
    url: "https://{{ argocd_host }}/auth/login?return_url=https%3A%2F%2F{{ argocd_host }}%2Fapplications"
    follow_redirects: none
    status_code: [302, 303]
  register: argocd_sso_redirect
  failed_when: argocd_sso_redirect.location is not search('^https://' ~ authentik_host ~ '/application/o/authorize/')
  delegate_to: localhost
  become: false

- name: Break-glass admin login works
  ansible.builtin.uri:
    url: "https://{{ argocd_host }}/api/v1/session"
    method: POST
    body_format: json
    body:
      username: admin
      password: "{{ argocd_admin_password }}"
    status_code: [200]
  when: argocd_admin_enabled
  delegate_to: localhost
  become: false
  no_log: true

- name: Display Argo CD summary
  ansible.builtin.debug:
    msg:
      - "Argo CD:  https://{{ argocd_host }}/  -> 'LOG IN VIA AUTHENTIK' (group {{ platform_admin_group }} = admin)"
      - "{{ ('break-glass: admin / ' ~ platform_secrets_dir ~ '/argocd_admin_password') if argocd_admin_enabled else 'local admin disabled' }}"
      - "CLI:      argocd login {{ argocd_host }} --sso --grpc-web"
