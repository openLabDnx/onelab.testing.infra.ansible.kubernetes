---
# A ConfigMap update reaches the mounted file only after the kubelet syncs
# (up to ~1 min): wait until the worker sees this run's blueprint.
- name: Wait for the worker to see the current blueprint
  ansible.builtin.command: >
    {{ authentik_kubectl }} exec deploy/authentik-worker -c worker --
    sha256sum /blueprints/mounted/cm-authentik-blueprints/platform.yaml
  register: authentik_blueprint_sum
  until: >-
    authentik_blueprint_sum.rc == 0 and authentik_blueprint_sum.stdout.split()[0] ==
    ((lookup('ansible.builtin.template', 'platform-blueprint.yaml.j2') | regex_replace('\n+$', '')) ~ '\n') | hash('sha256')
  retries: 30
  delay: 5
  changed_when: false

# On a fresh database the worker creates akadmin, the default flows and the
# self-signed certificate in the background; until then the blueprint's !Find
# lookups fail, so retry. Applying here (rather than waiting for the worker's
# own discovery) surfaces blueprint errors in this run.
- name: Apply the platform blueprint
  ansible.builtin.command: >
    {{ authentik_kubectl }} exec deploy/authentik-worker -c worker --
    ak apply_blueprint /blueprints/mounted/cm-authentik-blueprints/platform.yaml
  register: authentik_blueprint_run
  until: authentik_blueprint_run.rc == 0
  retries: 30
  delay: 10
  changed_when: false
