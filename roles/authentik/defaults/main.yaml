---
# Defaults for authentik role
# authentik is the SSO for the platform: OIDC for Argo CD and Portainer, and
# forward-auth (Traefik middleware) for UIs without their own login.
authentik_chart_repo_url: "https://charts.goauthentik.io"
authentik_chart_version: "2026.8.3"
authentik_server_replicas: 2
authentik_worker_replicas: 2
authentik_bootstrap_email: "mai.reaksa@autofik.com"   # email of the akadmin break-glass account

# PostgreSQL via CloudNativePG: primary + standby on the two primary-site nodes,
# automatic failover, synchronous replication that degrades to async when the
# standby is down. (A standby on worker1 would make a failover there slow for
# every client; the off-site copy is the daily backup instead.)
authentik_db_cluster: "authentik-db"
authentik_db_instances: 2
authentik_db_image: "ghcr.io/cloudnative-pg/postgresql:18.6-standard-trixie"
authentik_db_size: "10Gi"
# Longhorn, one copy on the instance's own node (roles/longhorn): PostgreSQL
# replication keeps the second copy.
authentik_db_storage_class: "longhorn-local-retain"

# Daily pg_dump (custom format) to a separate volume, kept 14 days. Two Longhorn
# copies (one per primary-site node), so the dumps survive losing a node.
authentik_backup_schedule: "30 2 * * *"
authentik_backup_retention_days: 14
authentik_backup_size: "10Gi"
authentik_backup_storage_class: "longhorn-retain"

authentik_kubectl: "{{ cluster_kubectl }} -n {{ authentik_namespace }}"

# LDAP for the super-admin app (tasks/ldap.yaml + blueprint): an LDAP provider whose
# application only superadmin_group may bind to, served by an outpost that authentik
# runs itself in this namespace (Deployment/Service ak-outpost-<name>). The app binds
# as the user and reads its own entry: no search account, no stored LDAP password.
authentik_ldap_enabled: true
authentik_ldap_outpost_replicas: 2
authentik_ldap_outpost_resources:
  requests: { cpu: 20m, memory: 64Mi }
  limits: { memory: 256Mi }
# Namespaces whose pods may connect to the outpost (NetworkPolicy).
authentik_ldap_client_namespaces:
  - "{{ superadmin_namespace }}"
  # The Super Admin API as deployed by Argo CD (autofik.api.dev.supper.admin-api).
  - "supper-admin-api"
# Usernames ADDED to superadmin_group on every run. Nobody is ever removed and
# users that do not exist yet are skipped; manage everyone else in the UI.
superadmin_members:
  - reaksamai
