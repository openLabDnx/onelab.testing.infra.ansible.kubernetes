---
# Defaults for monitoring role
# kube-prometheus-stack (Prometheus Operator, Prometheus, Grafana, node-exporter,
# kube-state-metrics) plus Kafka and RabbitMQ scraping, alerts and dashboards.
# Free alternative to Confluent Control Center (production.md MSG-01 option B).
kube_prometheus_stack_chart_repo_url: "https://prometheus-community.github.io/helm-charts"
kube_prometheus_stack_chart_version: "91.7.0"

monitoring_storage_class: "local-path-retain"
prometheus_retention: "15d"
prometheus_retention_size: "18GB"                  # below the volume size, oldest data dropped first
prometheus_storage_size: "20Gi"
prometheus_resources:
  requests: { cpu: 250m, memory: 1Gi }
  limits: { memory: 3Gi }
grafana_storage_size: "2Gi"
grafana_admin_user: "admin"                        # break-glass; people log in through authentik

# Dashboards loaded by Grafana's sidecar, pinned to the versions running here.
monitoring_dashboards:
  - { name: strimzi-kafka, folder: Kafka, url: "https://raw.githubusercontent.com/strimzi/strimzi-kafka-operator/{{ strimzi_dashboards_ref }}/packaging/examples/metrics/grafana-dashboards/strimzi-kafka.json" }
  - { name: strimzi-kraft, folder: Kafka, url: "https://raw.githubusercontent.com/strimzi/strimzi-kafka-operator/{{ strimzi_dashboards_ref }}/packaging/examples/metrics/grafana-dashboards/strimzi-kraft.json" }
  - { name: strimzi-kafka-exporter, folder: Kafka, url: "https://raw.githubusercontent.com/strimzi/strimzi-kafka-operator/{{ strimzi_dashboards_ref }}/packaging/examples/metrics/grafana-dashboards/strimzi-kafka-exporter.json" }
  - { name: strimzi-operators, folder: Kafka, url: "https://raw.githubusercontent.com/strimzi/strimzi-kafka-operator/{{ strimzi_dashboards_ref }}/packaging/examples/metrics/grafana-dashboards/strimzi-operators.json" }
  - { name: rabbitmq-overview, folder: RabbitMQ, url: "https://raw.githubusercontent.com/rabbitmq/rabbitmq-server/{{ rabbitmq_dashboards_ref }}/deps/rabbitmq_prometheus/docker/grafana/dashboards/RabbitMQ-Overview.json" }
  - { name: rabbitmq-quorum-queues, folder: RabbitMQ, url: "https://raw.githubusercontent.com/rabbitmq/rabbitmq-server/{{ rabbitmq_dashboards_ref }}/deps/rabbitmq_prometheus/docker/grafana/dashboards/RabbitMQ-Quorum-Queues-Raft.json" }
strimzi_dashboards_ref: "1.2.0"
rabbitmq_dashboards_ref: "v4.3.5"

# Strimzi's alert/recording rules (PrometheusRule), same version as the operator
strimzi_rules_base_url: "https://raw.githubusercontent.com/strimzi/strimzi-kafka-operator/{{ strimzi_dashboards_ref }}/packaging/examples/metrics/prometheus-install/prometheus-rules"
strimzi_rules:
  - prometheus-kafka-rules.yaml
  - prometheus-kafka-exporter-topic-rules-group.yaml
  - prometheus-strimzi-cluster-operator-rules.yaml
  - prometheus-strimzi-entity-operator-rules.yaml

# what the verification expects to see (roles/kafka, roles/rabbitmq)
monitoring_expected_kafka_brokers: 3
monitoring_expected_rabbitmq_nodes: 3

monitoring_kubectl: "{{ cluster_kubectl }} -n {{ observability_namespace }}"
