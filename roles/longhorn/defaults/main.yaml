---
# Defaults for longhorn role
# Longhorn gives every PersistentVolume replicated block storage on the nodes'
# own disks (/var/lib/longhorn on the root disk), instead of local-path. Node
# prerequisites (iSCSI, NFS client, multipath) come from roles/common.
longhorn_chart_repo_url: "https://charts.longhorn.io"
longhorn_version: "1.12.1"                # newest release Longhorn marks "Stable" (1.13.0 is "Latest" only)

# --- StorageClasses -------------------------------------------------------------
# Both keep the volume when its claim is deleted (Retain), like local-path-retain.
#
# Replicated: two copies, only on primary-site nodes (Longhorn node tag = the
# node's site). Every write waits for every copy, and worker1 is ~160 ms away,
# so no copy goes there. A pod that loses its node restarts on the other one
# with its data. For apps that run a single copy (Prometheus, Grafana, Loki,
# Jaeger, Portainer, the authentik backups).
longhorn_replicated_class: "longhorn-retain"
longhorn_replicated_replicas: 2
# Local: one copy, on the node where the volume is first used; Longhorn then pins
# the volume, and so its pod, to that node (like local-path). For apps that
# replicate their data themselves (Vault Raft, etcd, Kafka, RabbitMQ, PostgreSQL):
# a second Longhorn copy would only double every write.
longhorn_local_class: "longhorn-local-retain"
# The chart's own "longhorn" class (reclaimPolicy Delete) stays the cluster's
# default class, laid out like the replicated class.
longhorn_default_class_replicas: 2

# --- Longhorn settings (chart defaultSettings) -------------------------------------
longhorn_settings:
  # A pod on a node that went down is deleted once the node is NotReady, so its
  # volume can attach on another node instead of waiting for the old one.
  nodeDownPodDeletionPolicy: delete-both-statefulset-and-deployment-pod
  # `kubectl drain` evicts the pods first; a local-class volume (one copy, the app
  # keeps the others) may then stop with its node instead of blocking the drain
  # forever. Meant for in-place maintenance: never delete a drained node that
  # still holds the only copy of a volume.
  nodeDrainPolicy: allow-if-replica-is-stopped
  # Volumes are thin: the sizes in the claims add up to more than the disks
  # (~170 GiB per primary-site node against 135 GiB schedulable on the master).
  # Real usage is far lower and alerted on (LonghornDiskStorageWarning).
  storageOverProvisioningPercentage: 200
  defaultReplicaCount: "{{ longhorn_default_class_replicas }}"   # volumes made in the UI
  defaultDataLocality: best-effort
  # stale replica data and instances left behind by a failed node are cleaned up
  orphanResourceAutoDeletion: "replica-data;instance"
  # no calls home
  upgradeChecker: false
  allowCollectingLonghornUsageMetrics: false

longhorn_ui_replicas: 2

# Small image with GNU coreutils for the smoke test (also used by roles/local_path_migration)
longhorn_test_image: "docker.io/library/debian:trixie-20260918-slim"

longhorn_kubectl: "{{ cluster_kubectl }} -n {{ longhorn_namespace }}"
