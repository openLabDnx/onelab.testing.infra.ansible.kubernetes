---
# RKE2 Server (Master / Control-Plane) specific variables
rke2_service_name: "rke2-server"
rke2_install_type: "server"
rke2_write_kubeconfig_mode: "0644"

# Components to disable if needed (e.g., rke2-ingress-nginx, etc.)
# By default we leave them enabled to provide ingress and metrics
rke2_disable: []
# - rke2-ingress-nginx

# Etcd and supervisor ports
rke2_server_ports:
  - { port: "6443", proto: "tcp", comment: "Kubernetes API Server" }
  - { port: "9345", proto: "tcp", comment: "RKE2 Supervisor API" }
  - { port: "2379", proto: "tcp", comment: "etcd client port" }
  - { port: "2380", proto: "tcp", comment: "etcd peer port" }
  - { port: "10250", proto: "tcp", comment: "Kubelet metrics" }
  - { port: "8472", proto: "udp", comment: "Canal/Flannel VXLAN overlay" }
  - { port: "30000:32767", proto: "tcp", comment: "NodePort Services range" }
